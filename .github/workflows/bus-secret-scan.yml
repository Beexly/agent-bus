name: bus secret scan
on:
  push:
    branches: [main]
    paths: ["bus/**", "scripts/scan-secrets.sh", ".githooks/**"]
  pull_request:
    paths: ["bus/**", "scripts/scan-secrets.sh", ".githooks/**"]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan bus payloads
        run: sh scripts/scan-secrets.sh --tree
