# Run this on the Motif VM only. Do not run it on the Windows box.
# Resolved 2026-10-08 from ghcr.io tag 0.10.2.
# The old 0.4.9 pin is obsolete. Do not use :latest. Do not pass --pull always.
# The image line is a digest. Tag 0.10.2 moved to this digest on the registry that day.
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight@sha256:d1840062a5b79940ab7a9f4809ceb90fc776d4ad737cd9329e9b5836cc64ab70
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?set in the VM environment, never in git}
    volumes:
      - hindsight-data:/home/hindsight/.pg0
volumes:
  hindsight-data:
    name: hindsight-data
