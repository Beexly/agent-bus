# Orca launcher inventory. Not 22 leads.
# Motif is Muse. Motif writes inbox tasks. Motif does not claim.
# may_claim false unless billing and project are known.
# Unknown billing or unknown project means may_claim false.
# may_publish is false on every row. Motif accepts. Nobody here publishes.
schema_version: 1
lead: motif
rows:
  - id: claude
    binary: claude
    launch_flags: "--dangerously-skip-permissions"
    reports_to: motif
    projects_allowed: []
    may_claim: false
    may_publish: false
    billing_path: unknown
    skip_permissions: true
    note: installed in Orca. No project grant until billing is named.
